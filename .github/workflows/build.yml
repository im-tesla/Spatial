name: Build and verify Spatial
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mediainfo pkg-config
      - run: cargo test --locked -p spatial-server
      - run: cargo build --locked --release -p spatial-server
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-server-ubuntu-22.04
          path: |
            target/release/spatial-server
            deploy/

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: choco install ffmpeg -y --no-progress
      - shell: pwsh
        run: |
          $env:Path += ';C:\ProgramData\chocolatey\bin'
          ./tools/setup-mpv.ps1
          cargo test --locked -p spatial-server
          cd apps/desktop
          npm ci
          npm test
          npm run build
          cargo test --locked -p spatial-desktop
          npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-windows-x64-installer
          path: target/release/bundle/nsis/*setup.exe

  linux-desktop:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: bash tools/setup-linux-desktop.sh
      - name: Test compressed playback and desktop
        run: |
          bash tools/verify-passthrough-linux.sh
          cargo test --locked -p spatial-desktop
          dbus-run-session -- bash -c 'printf %s spatial-ci-only | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked -p spatial-desktop credentials::platform::tests -- --ignored'
          cd apps/desktop
          npm ci
          npm test
          npm run desktop:build
      - name: Check Debian playback dependency
        run: |
          test "$(find target/release/bundle/deb -name '*.deb' | wc -l)" -eq 1
          dpkg-deb --field target/release/bundle/deb/*.deb Depends | grep -w mpv
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-linux-x64-desktop
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
