name: macOS test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build the frontend and run unit tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Compile and test the desktop app
        run: cargo test --locked -p spatial-desktop
      - name: Build unsigned Apple Silicon DMG
        working-directory: apps/desktop
        env:
          CI: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run desktop:build -- --config src-tauri/tauri.macos.conf.json --target aarch64-apple-darwin
      - name: Show bundle output
        run: find target/aarch64-apple-darwin/release/bundle -maxdepth 3 -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: Spatial-macOS-arm64-unsigned
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
